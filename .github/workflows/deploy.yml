name: Deploy Yorder Web to Hostinger (CI/CD)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy to Hostinger (ywsglobal.com)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install Dependencies
        run: npm ci

      - name: 4. Build Production Bundle
        env:
          VITE_API_URL: https://api.ywsglobal.com/api
          VITE_SOCKET_URL: https://api.ywsglobal.com
          VITE_AUTH_TOKEN_KEY: yorder_web_auth_token
          VITE_BRAND_NAME: Yorder
          VITE_BRAND_TAGLINE: Real stores, real stock, counted by hand
          VITE_RAZORPAY_KEY_ID: rzp_live_q8hoDqsXGIQoqd
          VITE_RAZORPAY_NAME: Yorder
        run: npm run build

      - name: 5. Sync dist/ to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: false
