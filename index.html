<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yorder — Real stores, real stock, counted by hand</title>
    
    <!-- Primary Meta Tags -->
    <meta name="title" content="Yorder — Real stores, real stock, counted by hand" />
    <meta name="description" content="Every item on Yorder sits on a real shelf in a real store near you. Try sneakers, streetwear, watches, and tech at your door. Rider waits 10 minutes while you try — pay only for what you keep." />
    <meta name="keywords" content="Yorder, hyperlocal shopping, streetwear, sneakers, Superkicks, Bandra West, try at your door, instant delivery, Mumbai fashion, luxury watches" />
    <meta name="author" content="Yorder" />
    <meta name="theme-color" content="#0B0B0C" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <link rel="canonical" href="https://yorder.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yorder.com/" />
    <meta property="og:title" content="Yorder — Real stores, real stock, counted by hand" />
    <meta property="og:description" content="Every item on Yorder sits on a real shelf in a real store near you. Try at your door in 98 minutes. Keep what fits, return the rest on the spot." />
    <meta property="og:image" content="/assets/hero-drop.jpg" />
    <meta property="og:site_name" content="Yorder" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://yorder.com/" />
    <meta property="twitter:title" content="Yorder — Real stores, real stock, counted by hand" />
    <meta property="twitter:description" content="Every item on Yorder sits on a real shelf in a real store near you. Try at your door in 98 minutes. Keep what fits, return the rest on the spot." />
    <meta property="twitter:image" content="/assets/hero-drop.jpg" />

    <!-- Favicon & Icons (Cache-busted for instant browser tab update) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=yorder4" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=yorder4" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=yorder4" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=yorder4" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=yorder4" />

    <!-- Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (JSON-LD) for Search Engine Optimization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Yorder",
        "url": "https://yorder.com/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://yorder.com/products?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        },
        "description": "Hyperlocal marketplace connecting real shop floor inventory with instant door trials."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
